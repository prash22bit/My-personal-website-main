<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  
  <!-- Dark Rounded Container with Glass Border -->
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>
  <rect width="98" height="98" x="1" y="1" rx="25" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  
  <!-- Subtle accent dot -->
  <circle cx="82" cy="18" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- </p> Developer Closing Tag -->
  <text x="49" y="52" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace" font-size="35" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#71717a">&lt;</tspan><tspan fill="#ffffff">/p</tspan><tspan fill="#71717a">&gt;</tspan>
  </text>
</svg>